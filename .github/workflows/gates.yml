# 게이트를 이 컴퓨터 밖에서도 돌린다.
# 2026-07-27까지 CI가 없어 모든 초록이 개발자 한 명의 로컬 값이었고, TargetFramework가 net8.0인데
# RollForward로 .NET 10에서만 돌던 것을 아무도 몰랐다(measure가 .NET 8에서 죽었다).
# 그래서 런타임을 컨테이너로 격리한다 — 이미지 안에 그 버전 하나뿐이라 "어느 런타임이 돌았나"가
# 설정이 아니라 사실이 된다.
name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-07-27: NET8-01-R1이 server/Harness의 옵션을 HarnessJson.Options 한 벌로 모으고
        # TypeInfoResolver를 줬다. 그전에는 .NET 8에서 hs-scan이 exit 2였다(음성 사례로 재현 확인).
        # 컨테이너 실측에서 하네스 22개 exit code 표가 .NET 8과 .NET 10에서 한 줄도 다르지 않다.
        # 그 증거로 이 다리를 켠다. 빨간 채로 켜면 그 게이트는 무시된다(FAIL-2026-010) —
        # 초록으로 도착하지 않으면 이 줄을 되돌린다.
        sdk: ["10.0", "8.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # di-completion-check가 baselineCommit을 HEAD와 대조하고 gate-clean이 트리를 본다.
      # 컨테이너 안에서 checkout 디렉터리 소유자가 달라 git이 dubious ownership으로 거절한다.
      - name: git 신뢰 설정
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 환경 기록
        run: |
          uname -a
          dotnet --version
          dotnet --list-runtimes
          git --version
          head -c 200 docs/handoff/WORKSTATE.json | grep -q $'\r' && echo "체크아웃: CRLF" || echo "체크아웃: LF"

      - name: build
        run: dotnet build server -v q --nologo

      # 개별 하네스. 어느 것이 깨졌는지 로그에서 바로 보이게 한 줄씩 돌린다.
      # 출력을 버리지 않는다 - 실패하면 그 출력이 유일한 단서다. 2026-07-27 실측:
      # windows 다리에서 measure가 exit 1인데 stdout을 /dev/null로 보내 아무 단서도 안 남았다.
      - name: 하네스
        run: |
          set -e
          # 목록은 scripts/harness-list.txt 한 벌이다. 로컬 scripts/run-gates.sh 도 같은 파일을 읽는다.
          # 목록이 두 벌이면 한쪽만 늘어난다 - 2026-07-27 실측: 로컬 4개 / CI 10개로 갈려 있었고
          # context-pack-integrity 가 CI 에서 처음 깨졌다.
          while IFS= read -r c; do
            [ -z "$c" ] && continue
            case "$c" in "#"*) continue;; esac
            echo "--- $c"
            if ! dotnet run --project server --no-build -- $c > /tmp/h.out 2>&1; then
              echo "!!! $c 실패 - 출력:"
              cat /tmp/h.out
              exit 1
            fi
          done < scripts/harness-list.txt

      # 통합 게이트는 clean 트리에서 시작해야 한다 — 위 measure가 dashboard/data를 다시 썼다.
      - name: LAND
        run: |
          git checkout -- . && git clean -fdq
          dotnet run --project server --no-build -- di-completion-check --gate WP-STATE-INTEGRITY-LAND --task ci-land

      - name: POST-COMMIT
        run: |
          git checkout -- . && git clean -fdq
          dotnet run --project server --no-build -- di-completion-check --gate POST-COMMIT --task ci-post-commit

  windows:
    name: windows / 10.0
    runs-on: windows-latest
    # 러너에는 AspNetCore.App 8·9·10이 모두 깔려 있다. 이 프로젝트는 net8.0을 겨냥하므로
    # 그냥 두면 **8이 골라진다** — 잡 이름은 10.0인데 실제로는 8에서 돌았다(2026-07-27 첫 실행에서
    # hs-scan이 .NET 8 버그로 exit 2를 냈다). 이름과 실재를 맞춘다.
    # .NET 8 검증은 linux 컨테이너 다리가 맡는다(NET8-01이 켠다). 여기서 겸하지 않는다.
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 환경 기록
        shell: bash
        run: dotnet --version && dotnet --list-runtimes && git --version

      # PowerShell 5.1은 BOM 없는 .ps1을 ANSI로 읽어 한글을 깨뜨린다. 깨진 바이트가 없는
      # 중괄호로 파싱돼 엉뚱한 줄에서 문법 오류가 난다. 2026-07-27 하루에 세 번 밟았다.
      # 사람이 기억할 일이 아니라 검사가 잡을 일이다. 빌드보다 먼저 둔다 — 싸고 빠르다.
      - name: 스크립트 인코딩
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-script-encoding.ps1

      # 이 저장소에서 실제로 밟은 함정을 정적으로 잡는다. -SelfTest 를 먼저 돌린다 -
      # 안 잡게 된 검사기는 통과 도장만 찍으므로 없느니만 못하다.
      - name: 스크립트 함정
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-script-traps.ps1

      # 우선순위가 tier·factors 에서 계산한 값과 같은지. 숫자를 손으로 고치면 여기서 걸린다.
      - name: 백로그 우선순위 정책
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/backlog-policy-check.ps1 -SelfTest
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/backlog-policy-check.ps1 -SelfTest
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-script-traps.ps1

      - name: build
        shell: bash
        run: dotnet build server -v q --nologo

      - name: 하네스
        shell: bash
        run: |
          set -e
          # 목록은 scripts/harness-list.txt 한 벌이다. 로컬 scripts/run-gates.sh 도 같은 파일을 읽는다.
          # 목록이 두 벌이면 한쪽만 늘어난다 - 2026-07-27 실측: 로컬 4개 / CI 10개로 갈려 있었고
          # context-pack-integrity 가 CI 에서 처음 깨졌다.
          while IFS= read -r c; do
            [ -z "$c" ] && continue
            case "$c" in "#"*) continue;; esac
            echo "--- $c"
            if ! dotnet run --project server --no-build -- $c > /tmp/h.out 2>&1; then
              echo "!!! $c 실패 - 출력:"
              cat /tmp/h.out
              exit 1
            fi
          done < scripts/harness-list.txt

      - name: LAND
        shell: bash
        run: |
          git checkout -- . && git clean -fdq
          dotnet run --project server --no-build -- di-completion-check --gate WP-STATE-INTEGRITY-LAND --task ci-land

      - name: POST-COMMIT
        shell: bash
        run: |
          git checkout -- . && git clean -fdq
          dotnet run --project server --no-build -- di-completion-check --gate POST-COMMIT --task ci-post-commit
